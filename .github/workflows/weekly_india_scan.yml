name: Weekly India Value Scan

# Indian market (NSE) weekly schedule — times in IST (UTC+5:30)
# GitHub cron is UTC-only (no DST for India).
on:
  schedule:
    # Sunday 8:00 PM IST = 14:30 UTC
    # After the week’s NSE close; email ready before Monday 9:15 AM IST open
    - cron: "30 14 * * 0"
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Email a digest even if no MoS alerts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Run pipeline but skip sending email"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  india-scan:
    name: India (IST schedule)
    uses: ./.github/workflows/value_scan_reusable.yml
    secrets: inherit
    with:
      market: India
      force_digest: ${{ github.event.inputs.force_digest || 'false' }}
      dry_run: ${{ github.event.inputs.dry_run || 'false' }}
