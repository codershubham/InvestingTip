name: Manual Value Investing Scan

# Manual-only runner for USA / India / both (no cron).
# Scheduled runs live in:
#   - weekly_india_scan.yml  (Sunday 8:00 PM IST)
#   - weekly_usa_scan.yml    (Sunday 6:00 PM ET / 23:00 UTC)
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to scan"
        required: true
        default: "USA"
        type: choice
        options:
          - "USA"
          - "India"
          - "both"
      force_digest:
        description: "Email a digest even if no MoS alerts"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Run pipeline but skip sending email"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  resolve-markets:
    name: Resolve markets
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.set.outputs.markets }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ github.event.inputs.market }}" = "both" ]; then
            echo 'markets=["USA","India"]' >> "$GITHUB_OUTPUT"
          else
            M="${{ github.event.inputs.market }}"
            echo "markets=[\"${M:-USA}\"]" >> "$GITHUB_OUTPUT"
          fi

  value-scan:
    name: Scan ${{ matrix.market }}
    needs: resolve-markets
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(needs.resolve-markets.outputs.markets) }}
    uses: ./.github/workflows/value_scan_reusable.yml
    secrets: inherit
    with:
      market: ${{ matrix.market }}
      force_digest: ${{ github.event.inputs.force_digest || 'false' }}
      dry_run: ${{ github.event.inputs.dry_run || 'false' }}
