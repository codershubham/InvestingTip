name: Value Scan (reusable)

on:
  workflow_call:
    inputs:
      market:
        description: "USA or India"
        required: true
        type: string
      force_digest:
        description: "Email even with no MoS alerts"
        required: false
        type: string
        default: "false"
      dry_run:
        description: "Skip outbound email"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  value-scan:
    name: Scan ${{ inputs.market }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run value scan (${{ inputs.market }})
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_WHEN_EMPTY: ${{ inputs.force_digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          MARKET: ${{ inputs.market }}
          LOG_LEVEL: INFO
          ARTIFACT_DIR: artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--market "${{ inputs.market }}")
          if [ "${{ inputs.force_digest }}" = "true" ]; then
            ARGS+=(--force-digest)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python main.py "${ARGS[@]}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-scan-${{ inputs.market }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
